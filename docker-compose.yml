version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eazeevent-postgres-db
    restart: always
    environment:
      POSTGRES_USER: eazeevent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file at the project root — see .env.example}
      POSTGRES_DB: eazeevent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eazeevent_user -d eazeevent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eazeevent-fastapi-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://eazeevent_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file at the project root — see .env.example}@db:5432/eazeevent
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/static/uploads:/code/static/uploads

volumes:
  postgres_data:
